name: Build Linux ARM64 Codex++
on:
  workflow_dispatch:
jobs:
  build-linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: QEMU 模拟ARM64环境
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: aarch64
          distro: ubuntu24.04
          shell: /bin/bash
          install: |
            apt update -y
            apt install -y git build-essential libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            curl -fsSL https://get.pnpm.io/install.sh | sh -s -- -y
          run: |
            source "$HOME/.cargo/env"
            source "$HOME/.bashrc"
            pnpm install
            pnpm tauri build

      - name: 上传编译成品
        uses: actions/upload-artifact@v4
        with:
          path: src-tauri/target/release/bundle/
